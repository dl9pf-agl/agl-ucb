header:
  version: 22

distro: agl

repos:
  # Declared here, unconditionally, same as bitbake/openembedded-core below - kas's own
  # repos-resolution already does exists-or-fetch (use path: if already checked out under
  # agl-ucb, clone from url: if not), so there's nothing for aglsetup.sh to decide or
  # generate. Trade-off, deliberate: every build fetches all 3 AGL repos, even a core-only
  # one - KISS over the earlier selective-declare optimization.
  # `branch:` without `commit:` makes kas hard-reset the checkout to the branch tip on every
  # invocation - confirmed live, the hard way (destroyed local, not-yet-pushed commits in a
  # sandbox clone, twice, before this was caught). Real deployment: push to these repos' own
  # master first, then this problem never arises (local HEAD = remote tip, nothing to lose).
  # For now (sandbox + not yet pushed): path:-only, no url:/branch: - requires the 3 AGL repos
  # pre-cloned, same as meta-agl already was. kas/pins.yml is where a real commit: pin for each
  # would go once this repo is live upstream.
  meta-agl:
    path: meta-agl
    layers:
      meta-agl-core:
      meta-agl-bsp:
  meta-agl-demo:
    path: meta-agl-demo
    layers: {}   # the features under kas/feature/ add whichever layers they need
  meta-agl-devel:
    path: meta-agl-devel
    layers: {}   # its subdirs are the real layers, not its own root
  bitbake:
    url: https://git.openembedded.org/bitbake
    path: external/bitbake
    branch: "2.18"
    layers: {}   # bitbake is the tool itself, not a bitbake layer
  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    path: external/openembedded-core
    branch: wrynose
    layers:
      meta:
  meta-lts-mixins-rust:
    url: https://git.yoctoproject.org/meta-lts-mixins
    path: external/meta-lts-mixins_rust
    branch: wrynose/rust
  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded
    path: external/meta-openembedded
    branch: wrynose
    layers:
      meta-oe:

bblayers_conf_header:
  standard: |
    LCONF_VERSION = "6"

local_conf_header:
  standard: |
    DISTRO = "agl"
    require conf/include/base-agl.inc
    PACKAGE_CLASSES = "package_rpm"
    USER_CLASSES = "buildstats"
    PATCHRESOLVE = "noop"
    CONF_VERSION = "2"
    BB_DISKMON_DIRS = "STOPTASKS,${TMPDIR},1G,100K STOPTASKS,${DL_DIR},1G,100K STOPTASKS,${SSTATE_DIR},1G,100K HALT,${TMPDIR},100M,1K HALT,${DL_DIR},100M,1K HALT,${SSTATE_DIR},100M,1K"
  ci: |
    BB_NUMBER_THREADS ?= "4"
    PARALLEL_MAKE ?= "-j 4"
