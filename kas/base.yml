# SPDX-License-Identifier: MIT
header:
  version: 22

distro: agl

repos:
  # AGL layers: kas clones them on first use (clone agl-ucb, run scripts/aglsetup.sh, done).
  # Without `commit:` kas hard-resets a CLEAN clone to the branch tip on every run, which drops
  # unpushed commits (a dirty clone is skipped). To work on a layer use dev mode
  # (`aglsetup.sh --dev`, kas/local/dev.yml: kas leaves the clones alone). CI adds a generated
  # fragment with `commit:` (and a fork `url:`) for the repo under test.
  meta-agl:
    url: https://github.com/dl9pf-agl/meta-agl.git
    branch: master
    layers:
      meta-agl-core:
      meta-agl-bsp:
  meta-agl-demo:
    url: https://github.com/dl9pf-agl/meta-agl-demo.git
    branch: master
    layers: {}   # the features under kas/feature/ add whichever layers they need
  meta-agl-devel:
    url: https://github.com/dl9pf-agl/meta-agl-devel.git
    branch: master
    layers: {}   # its subdirs are the real layers, not its own root
  bitbake:
    url: https://git.openembedded.org/bitbake
    path: external/bitbake
    branch: "2.18"
    layers: {}   # bitbake is the tool itself, not a bitbake layer
  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    path: external/openembedded-core
    branch: wrynose
    layers:
      meta:
  meta-lts-mixins-rust:
    url: https://git.yoctoproject.org/meta-lts-mixins
    path: external/meta-lts-mixins_rust
    branch: wrynose/rust
  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded
    path: external/meta-openembedded
    branch: wrynose
    layers:
      meta-oe:

bblayers_conf_header:
  standard: |
    LCONF_VERSION = "6"

local_conf_header:
  standard: |
    DISTRO = "agl"
    require conf/include/base-agl.inc
    PACKAGE_CLASSES = "package_rpm"
    USER_CLASSES = "buildstats"
    PATCHRESOLVE = "noop"
    CONF_VERSION = "2"
    BB_DISKMON_DIRS = "STOPTASKS,${TMPDIR},1G,100K STOPTASKS,${DL_DIR},1G,100K STOPTASKS,${SSTATE_DIR},1G,100K HALT,${TMPDIR},100M,1K HALT,${DL_DIR},100M,1K HALT,${SSTATE_DIR},100M,1K"
  ci: |
    BB_NUMBER_THREADS ?= "4"
    PARALLEL_MAKE ?= "-j 4"
