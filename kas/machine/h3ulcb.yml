# SPDX-License-Identifier: MIT
header:
  version: 22

machine: h3ulcb

repos:
  meta-renesas:
    url: https://github.com/renesas-rcar/meta-renesas
    path: bsp/meta-renesas
    branch: wrynose-dev
    layers:
      meta-rcar-gen3:
  meta-yocto:
    url: https://git.yoctoproject.org/meta-yocto
    path: external/meta-yocto
    branch: wrynose
    layers:
      meta-yocto-bsp:
      meta-poky:
  meta-openembedded:
    layers:
      meta-python:

# Proprietary R-Car gfx/multimedia package copy (aglsetup.sh's 50_setup.sh) and EULA
# acceptance are NOT expressed here - kas has no imperative-hook mechanism. They are
# handled by ci/scripts/setup.sh as a pre-build step wrapping the existing
# meta-agl-bsp/meta-rcar-gen3/scripts/setup_mm_packages.sh logic, and via EULA_H3ULCB=1
# set from ci/build-matrix.yaml's eula: flag. See ci/scripts/setup.sh.

local_conf_header:
  h3ulcb: |
    require conf/include/agl_h3ulcb.inc
