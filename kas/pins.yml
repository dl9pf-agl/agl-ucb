header:
  version: 22

# Single consolidated source of truth for every external (non-vendored) repo's pinned commit,
# across every machine/feature fragment. Always colon-joined last by ci/scripts/_compose_kasfiles.py
# - no per-combo lockfiles, no per-fragment overrides. Regenerate entries here with `make lock`
# when deliberately bumping a repo; review the diff before committing.
#
# Realigned to match the classic AGL repo-tool manifest (/home/dl9pf/AGL/master/.repo/manifests/
# default.xml) rather than each repo's independently-floated `make pin-update` tip - that's the
# validated-together combination the AGL project actually tests, and the previous independent
# floats had drifted out of mutual compatibility (meta-flutter's pin had moved ~6 months ahead of
# its paired openembedded-core pin, which doesn't understand the newer SPDX "AND"/"OR" LICENSE
# syntax meta-flutter's current recipes use - surfaced as `license-format` QA errors on
# libwebrtc/rive-text). meta-agl/meta-agl-demo/meta-agl-devel are intentionally excluded here -
# those are vendored git subtrees tracked directly in this repo, not external repos kas fetches.
