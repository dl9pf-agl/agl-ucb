# SPDX-License-Identifier: MIT
name: release
# The release of AGL: starts when a release engineer pushes a tag <branch>_<version> (for example vimba_22.0.2; rehearsals use
# the codename releasetest). The tag must sit on a commit that has kas/releases/pins_<branch>_<version>.yml
# (scripts/prepare-release.sh makes it, a pull request merges it). Tag protection (ruleset "release tags") lets only repository
# admins create such tags; the signature that promote.sh checks names this tag (refs/tags/...).
# All work is in the pinned reusable workflow of agl-ci: build on the trusted pool, sign in a job with the only id-token,
# publish the signed files as a GitHub release. Bump the pin by pull request like every other pin.
on:
  push:
    tags: ['[a-z]*_[0-9]*.[0-9]*.[0-9]*']

permissions: {}

jobs:
  release:
    uses: dl9pf-agl/agl-ci/.github/workflows/release.yml@a78d7dad32c21f55192bab2da5f51b6c8c34b1fc # main (agl-ci#87: release flow, plain tar, chapter 19)
    # A called workflow cannot have more than its caller, so this is the ceiling. id-token: write is used by its signing job (attest) only,
    # contents: write by its publish job only (it creates the GitHub release with the signed files); no job has both.
    permissions: { contents: write, id-token: write }
